name: Deploy Thai SRS to GitHub Pages

on:
  push:
    branches: [main]
    paths:
      - "lite/thai/script/**"
      - ".github/workflows/deploy-thai-srs.yml"
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4
        with:
          version: 9

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
          cache-dependency-path: lite/thai/script/app/pnpm-lock.yaml

      - name: Install dependencies
        working-directory: lite/thai/script/app
        run: pnpm install --frozen-lockfile

      - name: Build
        working-directory: lite/thai/script/app
        run: pnpm build

      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: lite/thai/script/app/dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
