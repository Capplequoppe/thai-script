name: Deploy Thai SRS to GitHub Pages

on:
  push:
    branches: [main]
    paths:
      - "src/**"
      - "public/**"
      - "index.html"
      - "package.json"
      - "pnpm-lock.yaml"
      - "vite.config.ts"
      - "tsconfig.json"
      - ".github/workflows/deploy-thai-srs.yml"
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4
        with:
          version: 9

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
          cache-dependency-path: pnpm-lock.yaml

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Test
        run: pnpm test

      - name: Build
        run: pnpm build
        env:
          # The current Cloudflare Tunnel URL for the conversation-practice
          # backend, or empty on an ordinary push where nothing has set it —
          # `ConversationBackendSettings.ts` falls back to the same-machine
          # address either way. Kept current by
          # `backend/scripts/run_with_tunnel.sh` (`gh variable set
          # CONVERSATION_BACKEND_URL ...`), which also triggers this
          # workflow via `workflow_dispatch` so a fresh tunnel URL reaches
          # deployed devices without a code change. A public *address*
          # only — never a secret, and never the auth token — see that
          # settings file's own doc comment for why.
          VITE_CONVERSATION_BACKEND_URL: ${{ vars.CONVERSATION_BACKEND_URL }}

      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
