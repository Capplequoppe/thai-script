[project]
name = "generate-conversation-bank"
version = "0.1.0"
description = "Offline generator for the AI conversation-practice question bank"
requires-python = ">=3.11"
dependencies = [
    "pythainlp>=5.0",
]

[project.optional-dependencies]
# Only the generation step needs a GPU stack. The filter, the id scheme and the
# serializer are pure Python, so the default install (and therefore the default
# `pytest -m "not gpu"` run) stays light.
gpu = [
    "torch>=2.4",
    "transformers>=4.44",
    "accelerate>=0.33",
]

[project.scripts]
generate-conversation-bank = "generate_conversation_bank.__main__:main"

[dependency-groups]
dev = [
    "pytest>=8",
    "ruff>=0.6",
]

[tool.ruff]
line-length = 90

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]

[tool.ruff.lint.per-file-ignores]
# The system prompt is a natural-language document inside a string literal; its
# line breaks are what the model reads, not a formatting choice.
"src/generate_conversation_bank/generation.py" = ["E501"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/generate_conversation_bank"]

[tool.pytest.ini_options]
markers = [
    "gpu: needs a local GPU and the real model weights; excluded from the default run",
]
testpaths = ["tests"]
