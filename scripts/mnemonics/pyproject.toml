[project]
name = "mnemonic-illustrations"
version = "0.1.0"
description = "Illustrate authored vocabulary mnemonics with a local diffusion model"
requires-python = ">=3.11"
dependencies = [
    "diffusers>=0.31",
    "torch>=2.0",
    "transformers>=4.44",
    "accelerate>=0.34",
    "safetensors>=0.4",
    "pillow>=10",
    "sentencepiece>=0.2",
    "fonttools>=4.50",
]

[tool.uv]
package = false
